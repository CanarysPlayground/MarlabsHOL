# Leave Manager — CI pipeline
# STARTER STATE (HOL 5 / Day 4): Build stage only. The first run FAILS on purpose:
# participants read the log with Copilot and fix it, then extend the pipeline.

trigger:
  branches:
    include:
      - main
      - feature/*

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  dotnetVersion: 8.0.x
  nodeVersion: 20.x

stages:
  - stage: Build
    displayName: Build and test
    jobs:
      - job: BuildApi
        displayName: .NET API
        steps:
          - task: UseDotNet@2
            displayName: Use .NET $(dotnetVersion)
            inputs:
              packageType: sdk
              version: $(dotnetVersion)

          - task: DotNetCoreCLI@2
            displayName: dotnet restore
            inputs:
              command: restore
              projects: LeaveManager.sln

          - task: DotNetCoreCLI@2
            displayName: dotnet build
            inputs:
              command: build
              projects: LeaveManager.sln
              arguments: --configuration $(buildConfiguration) --no-restore

          - task: DotNetCoreCLI@2
            displayName: dotnet test
            inputs:
              command: test
              projects: tests/LeaveManager.Tests/LeaveManager.Tests.csproj
              arguments: --configuration $(buildConfiguration) --no-build

      - job: BuildUi
        displayName: Angular UI
        steps:
          - task: NodeTool@0
            displayName: Use Node $(nodeVersion)
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            displayName: npm ci
            workingDirectory: src/leave-manager-ui

          - script: npm run build
            displayName: ng build
            workingDirectory: src/leave-manager-ui
